<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>下拉框浏览器回归检查</title>
  <link rel="stylesheet" href="../public/style.css" />
  <main class="page">
    <h1>下拉框浏览器回归检查</h1>
    <p>
      从项目根目录运行 <code>python3 -m http.server 3138 --bind 127.0.0.1</code>，打开
      /test/select.browser.html。
    </p>
    <form id="fixture">
      <label class="field-label" for="choice">选择币种</label>
      <select
        id="choice"
        name="choice"
        class="field-control field-control--select"
        aria-describedby="help"
      >
        <option value="">选择币种</option>
        <option value="btc">BTCUSDT</option>
        <option value="blocked" disabled>不可选</option>
        <option value="hidden" hidden>条件不适用</option>
        <option value="eth">ETHUSDT</option>
      </select>
      <p id="help" class="help">保留原生字段和表单事件。</p>
      <label class="field-label" for="second">其他字段</label>
      <select id="second" class="field-control field-control--select">
        <option>A</option>
        <option>B</option>
      </select>
      <label class="field-label" for="coin">USDT 永续币种</label>
      <select
        id="coin"
        name="coin"
        data-search="搜索币种"
        class="field-control field-control--select"
      >
        <option value="">仅查看账户</option>
        <option value="ETHUSDT">ETHUSDT</option>
        <option value="BTCUSDT">BTCUSDT</option>
        <option value="1000PEPEUSDT">1000PEPEUSDT</option>
      </select>
    </form>
    <button id="run" class="button">运行检查</button>
    <pre id="results" role="status"></pre>
  </main>
  <script type="module">
    import { enhanceSelects } from '../public/select.js';
    const sync = enhanceSelects();
    const select = document.getElementById('choice');
    const trigger = document.getElementById('choice-trigger');
    const menu = document.getElementById('choice-options');
    const results = document.getElementById('results');
    const events = [];
    for (const type of ['input', 'change'])
      document
        .getElementById('fixture')
        .addEventListener(type, (event) => events.push([event.type, event.target]));
    const key = (value) =>
      trigger.dispatchEvent(
        new KeyboardEvent('keydown', { key: value, bubbles: true, cancelable: true }),
      );
    const assert = (condition, message) => {
      if (!condition) throw new Error(message);
      results.textContent += `✓ ${message}\n`;
    };
    document.getElementById('run').addEventListener('click', async () => {
      results.textContent = '';
      try {
        select.replaceChildren(
          ...[
            ['选择币种', ''],
            ['BTCUSDT', 'btc'],
            ['不可选', 'blocked'],
            ['条件不适用', 'hidden'],
            ['ETHUSDT', 'eth'],
          ].map(([label, value]) => new Option(label, value)),
        );
        select.options[2].disabled = true;
        select.options[3].hidden = true;
        select.value = '';
        select.disabled = false;
        select.removeAttribute('aria-invalid');
        sync();
        events.length = 0;
        await Promise.resolve();
        assert(trigger.getAttribute('aria-describedby') === 'help', '帮助文本关联保留');
        assert(document.querySelector('label').htmlFor === trigger.id, '标签关联可见控件');
        trigger.click();
        assert(!menu.hidden && menu.children.length === 4, '展开时排除隐藏选项');
        key('ArrowDown');
        key('ArrowDown');
        assert(
          document.getElementById(trigger.getAttribute('aria-activedescendant')).textContent ===
            'ETHUSDT',
          '方向键跳过禁用项',
        );
        assert(select.value === '' && events.length === 0, '浏览选项不修改方案');
        key('Escape');
        assert(menu.hidden && select.value === '', 'Escape 取消且保留原值');
        trigger.click();
        key('End');
        key('Enter');
        assert(
          select.value === 'eth' && menu.hidden && document.activeElement === trigger,
          'Enter 提交并保留焦点',
        );
        assert(
          events.length === 2 &&
            events[0][0] === 'input' &&
            events[1][0] === 'change' &&
            events.every((event) => event[1] === select),
          '原生字段按顺序发出冒泡 input/change',
        );
        assert(
          new FormData(document.getElementById('fixture')).get('choice') === 'eth',
          '表单提交读取原生字段值',
        );
        trigger.click();
        key('Enter');
        assert(events.length === 2, '重复选择不触发方案失效');
        trigger.click();
        key('b');
        key('Enter');
        assert(select.value === 'btc', '输入字母定位币种');
        trigger.click();
        key('End');
        key('Tab');
        assert(menu.hidden && select.value === 'btc', 'Tab 关闭且不提交未确认的选择');
        select.value = 'eth';
        sync();
        assert(trigger.textContent === 'ETHUSDT', '程序恢复字段后同步显示');
        select.add(new Option('SOLUSDT', 'sol'));
        await Promise.resolve();
        trigger.click();
        menu.lastElementChild.click();
        assert(select.value === 'sol', '动态新增选项可选择');
        select.setAttribute('aria-invalid', 'true');
        await Promise.resolve();
        assert(trigger.getAttribute('aria-invalid') === 'true', '错误状态同步');
        trigger.click();
        select.disabled = true;
        await Promise.resolve();
        assert(trigger.disabled && menu.hidden, '字段禁用时关闭面板并禁用触发器');
        select.disabled = false;
        await Promise.resolve();
        trigger.click();
        document.getElementById('second-trigger').click();
        assert(
          menu.hidden && !document.getElementById('second-options').hidden,
          '一次只展开一个下拉框',
        );
        document.getElementById('second-trigger').click();
        select.replaceChildren(new Option('恢复的模板', 'restored'));
        select.value = 'restored';
        await Promise.resolve();
        assert(trigger.textContent === '恢复的模板', '模板替换与程序选值同步');
        select.focus();
        assert(document.activeElement === trigger, '原生字段的程序焦点转交可见控件');
        const coin = document.getElementById('coin');
        const coinTrigger = document.getElementById('coin-trigger');
        const coinMenu = document.getElementById('coin-options');
        const coinSearch = document.getElementById('coin-search');
        const optionLabels = () =>
          [...coinMenu.querySelectorAll('[role="option"]')].map((item) => item.textContent);
        const activeLabel = () =>
          document.getElementById(coinTrigger.getAttribute('aria-activedescendant'))?.textContent;
        const typeQuery = (query) => {
          coinSearch.value = query;
          coinSearch.dispatchEvent(new Event('input', { bubbles: true }));
        };
        assert(
          !document.getElementById('choice-search') && !document.getElementById('second-search'),
          '未标记的下拉框没有搜索框',
        );
        assert(
          coinSearch.getAttribute('aria-label') === '搜索币种' &&
            coinSearch.placeholder === '搜索币种',
          '搜索框使用搜索币种作为名称',
        );
        assert(
          coinSearch.getAttribute('autocomplete') === 'off' &&
            coinSearch.autocapitalize === 'none' &&
            coinSearch.getAttribute('autocorrect') === 'off' &&
            coinSearch.spellcheck === false,
          '关闭自动大写、纠错和拼写检查',
        );
        assert(coinSearch.getAttribute('name') === null, '搜索框不是表单字段');
        coin.value = 'BTCUSDT';
        sync();
        coinTrigger.click();
        assert(
          document.activeElement === coinSearch && coinSearch.value === '' && !coinMenu.hidden,
          '打开后聚焦空搜索框',
        );
        assert(
          optionLabels().join() === '仅查看账户,ETHUSDT,BTCUSDT,1000PEPEUSDT' &&
            activeLabel() === 'BTCUSDT',
          '空搜索高亮当前合约并保持原顺序',
        );
        typeQuery('pepe');
        assert(
          optionLabels().join() === '1000PEPEUSDT' &&
            activeLabel() === '1000PEPEUSDT' &&
            coin.value === 'BTCUSDT',
          '子串筛选不改变已选值',
        );
        typeQuery('Btc');
        assert(optionLabels().join() === 'BTCUSDT', '匹配不区分大小写');
        typeQuery('t');
        assert(optionLabels().join() === 'ETHUSDT,BTCUSDT,1000PEPEUSDT', '多条命中保持原顺序');
        coinSearch.dispatchEvent(
          new KeyboardEvent('keydown', { key: 'ArrowDown', bubbles: true, cancelable: true }),
        );
        coinSearch.dispatchEvent(
          new KeyboardEvent('keydown', { key: 'ArrowDown', bubbles: true, cancelable: true }),
        );
        coinSearch.dispatchEvent(
          new KeyboardEvent('keydown', { key: 'ArrowDown', bubbles: true, cancelable: true }),
        );
        assert(activeLabel() === '1000PEPEUSDT', '方向键在结果末尾停下');
        typeQuery('zzzz');
        assert(
          coinMenu.querySelector('.select-control__empty')?.textContent === '无匹配币种' &&
            !coinTrigger.hasAttribute('aria-activedescendant'),
          '无命中时显示不可选提示',
        );
        coinSearch.dispatchEvent(
          new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }),
        );
        assert(!coinMenu.hidden && coin.value === 'BTCUSDT', '无命中时回车不改已选值');
        typeQuery('');
        assert(
          optionLabels()[0] === '仅查看账户' && activeLabel() === 'BTCUSDT',
          '删空搜索词后恢复完整列表',
        );
        coinSearch.dispatchEvent(
          new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }),
        );
        assert(
          coinMenu.hidden &&
            coinSearch.value === '' &&
            coin.value === 'BTCUSDT' &&
            document.activeElement === coinTrigger,
          'Escape 关闭并丢掉搜索词',
        );
        coinTrigger.dispatchEvent(
          new KeyboardEvent('keydown', { key: 'p', bubbles: true, cancelable: true }),
        );
        assert(
          !coinMenu.hidden &&
            document.activeElement === coinSearch &&
            coinSearch.value === 'p' &&
            optionLabels().join() === '1000PEPEUSDT',
          '关闭时按字母打开并作为搜索词',
        );
        coin.add(new Option('PEPEUSDT', 'PEPEUSDT'));
        await Promise.resolve();
        assert(
          !coinMenu.hidden &&
            optionLabels().join() === '1000PEPEUSDT,PEPEUSDT' &&
            coin.value === 'BTCUSDT',
          '名单更新时保持打开并重新筛选',
        );
        coinSearch.dispatchEvent(
          new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }),
        );
        assert(
          coin.value === '1000PEPEUSDT' &&
            coinMenu.hidden &&
            document.activeElement === coinTrigger,
          '回车确认高亮项并回到按钮',
        );
        assert(
          new FormData(document.getElementById('fixture')).get('coin') === '1000PEPEUSDT',
          '表单提交仍读取原生币种',
        );
        coinTrigger.click();
        typeQuery('eth');
        coinSearch.dispatchEvent(
          new KeyboardEvent('keydown', { key: 'Tab', bubbles: true, cancelable: true }),
        );
        assert(coinMenu.hidden && coin.value === '1000PEPEUSDT', 'Tab 关闭且不提交未确认的筛选');
        coinTrigger.click();
        window.dispatchEvent(new Event('resize'));
        window.visualViewport?.dispatchEvent(new Event('resize'));
        assert(!coinMenu.hidden, '视口高度变化不关闭币种菜单');
        document.getElementById('second-trigger').click();
        assert(
          coinMenu.hidden && !document.getElementById('second-options').hidden,
          '打开其他下拉框时关闭币种菜单',
        );
        results.textContent += '\n全部通过';
      } catch (error) {
        results.textContent += `\n失败：${error.message}`;
        throw error;
      }
    });
  </script>
</html>
